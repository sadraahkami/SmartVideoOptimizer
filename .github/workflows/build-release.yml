name: Build & Release SmartVideoOptimizer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SmartVideoOptimizer.slnx

      - name: Run Automated Test Suite
        run: dotnet test SmartVideoOptimizer.slnx --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish Windows Standalone App
        run: >
          dotnet publish src/SmartVideoOptimizer.App/SmartVideoOptimizer.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o release/SmartVideoOptimizer-win-x64

      - name: Archive Binary Package
        run: |
          powershell Compress-Archive -Path release/SmartVideoOptimizer-win-x64/* -DestinationPath release/SmartVideoOptimizer-v1.0-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/SmartVideoOptimizer-v1.0-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
